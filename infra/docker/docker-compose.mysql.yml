services:
  mysql:
    image: mysql:8.4
    container_name: coinbase-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_HOST_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - coinbase-streaming-network

  mysql-candle-writer:
    build:
      context: ../..
      dockerfile: services/analytics_writer/Dockerfile
    image: coinbase-analytics-writer:local
    container_name: coinbase-mysql-candle-writer
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
      KAFKA_TOPIC: coinbase.analytics.candles_1m
      KAFKA_GROUP_ID: mysql-candle-writer-v1
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - coinbase-streaming-network

volumes:
  mysql-data:
    name: coinbase-streaming-mysql-data

networks:
  coinbase-streaming-network:
    external: true
