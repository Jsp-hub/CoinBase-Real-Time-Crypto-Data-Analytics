apiVersion: 1

datasources:
  - name: Coinbase MySQL
    uid: coinbase-mysql
    type: mysql
    access: proxy
    url: mysql:3306
    user: $MYSQL_USER
    isDefault: true
    editable: false
    jsonData:
      database: $MYSQL_DATABASE
      maxOpenConns: 10
      maxIdleConns: 2
      connMaxLifetime: 14400
    secureJsonData:
      password: $MYSQL_PASSWORD
