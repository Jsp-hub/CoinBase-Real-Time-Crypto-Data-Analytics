global:
  scrape_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]
  - job_name: flink-jobmanager
    static_configs:
      - targets: ["flink-jobmanager-metrics:9249"]
  - job_name: flink-taskmanager
    static_configs:
      - targets: ["flink-taskmanager-metrics:9249"]
  - job_name: spark-master
    metrics_path: /metrics/master/prometheus/
    static_configs:
      - targets: ["spark-master-metrics:8080"]
  - job_name: spark-worker
    metrics_path: /metrics/prometheus/
    static_configs:
      - targets: ["spark-worker-metrics:8081"]
  - job_name: spark-trade-curator
    metrics_path: /metrics/prometheus/
    static_configs:
      - targets: ["spark-trade-curator-metrics:4040"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: metrics_.*_driver_spark_streaming_.*_inputRate_total_Value
        target_label: __name__
        replacement: spark_streaming_input_rate_total
      - source_labels: [__name__]
        regex: metrics_.*_driver_spark_streaming_.*_processingRate_total_Value
        target_label: __name__
        replacement: spark_streaming_processing_rate_total
      - source_labels: [__name__]
        regex: metrics_.*_driver_spark_streaming_.*_latency_Value
        target_label: __name__
        replacement: spark_streaming_latency_ms
  - job_name: mysql-candle-writer
    static_configs:
      - targets: ["mysql-candle-writer-metrics:9400"]
